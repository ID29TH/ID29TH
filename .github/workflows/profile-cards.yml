name: Profile cards

# Builds the profile cards and the contribution snake as static SVGs inside
# this repo, so the README never depends on rate-limited public endpoints.
# The stats card comes from github-readme-stats; the rest are drawn in black
# and white by .github/scripts/profile-cards.mjs.
on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&ring_color=FFFFFF&hide_border=false&border_color=21262d&border_radius=10&bg_color=000000&title_color=FFFFFF&icon_color=FFFFFF&text_color=C9D1D9

      - name: Streak, graph, languages, WakaTime and featured repo cards
        run: >-
          node .github/scripts/profile-cards.mjs
          --login "${{ github.repository_owner }}"
          --wakatime ECqStudio
          --pin ECq-Studio-s/thai-shipping-pricing
          --out profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#3d444d,#6e7681,#b1bac4,#ffffff&color_background=#000000

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
