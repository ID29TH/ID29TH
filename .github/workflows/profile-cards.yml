name: Profile cards

# Builds the stats / languages / WakaTime / pinned-repo cards, the streak and
# contribution graph, and the contribution snake
# as static SVGs inside this repo, so the README never depends on rate-limited
# public endpoints.
on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&ring_color=FFFFFF&hide_border=false&border_color=21262d&border_radius=10&bg_color=000000&title_color=FFFFFF&icon_color=FFFFFF&text_color=C9D1D9

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=false&border_color=21262d&border_radius=10&bg_color=000000&title_color=FFFFFF&icon_color=FFFFFF&text_color=C9D1D9

      - name: WakaTime card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=ECqStudio&langs_count=6&layout=compact&hide_title=true&hide_border=false&border_color=21262d&border_radius=10&bg_color=000000&title_color=FFFFFF&icon_color=FFFFFF&text_color=C9D1D9

      - name: Featured repo card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-thai-shipping-pricing.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=ECq-Studio-s&repo=thai-shipping-pricing&show_owner=true&hide_border=false&border_color=21262d&border_radius=10&bg_color=000000&title_color=FFFFFF&icon_color=FFFFFF&text_color=C9D1D9

      - name: Streak and contribution graph
        run: node .github/scripts/contrib-cards.mjs "${{ github.repository_owner }}" profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#3d444d,#6e7681,#b1bac4,#ffffff&color_background=#000000

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git pull --rebase origin main
          git push
