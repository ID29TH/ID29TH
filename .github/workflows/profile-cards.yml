name: Profile cards

# Builds the stats / languages / pinned-repo cards and the contribution snake
# as static SVGs inside this repo, so the README never depends on rate-limited
# public endpoints.
on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-cards.yml"]

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&include_all_commits=true&rank_icon=github&ring_color=DD2727&hide_border=false&border_color=21262d&border_radius=10&bg_color=0d0d0d&title_color=DD2727&icon_color=DD2727&text_color=c9d1d9

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_title=true&hide_border=false&border_color=21262d&border_radius=10&bg_color=0d0d0d&title_color=DD2727&icon_color=DD2727&text_color=c9d1d9

      - name: WakaTime card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: wakatime
          path: profile/wakatime.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=ECqStudio&langs_count=6&custom_title=WakaTime%20%C2%B7%20last%207%20days&hide_border=false&border_color=21262d&border_radius=10&bg_color=0d0d0d&title_color=DD2727&icon_color=DD2727&text_color=c9d1d9

      - name: Featured repo card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-thai-shipping-pricing.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=ECq-Studio-s&repo=thai-shipping-pricing&show_owner=true&hide_border=false&border_color=21262d&border_radius=10&bg_color=0d0d0d&title_color=DD2727&icon_color=DD2727&text_color=c9d1d9

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake.svg?palette=github-dark&color_snake=DD2727&color_background=0d0d0d

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git pull --rebase origin main
          git push
